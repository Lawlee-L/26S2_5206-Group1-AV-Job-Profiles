# Builds every container image on each push to main and publishes them to
# GitHub Container Registry (ghcr.io):
#   backend, frontend         -> picked up automatically by Watchtower
#   collector, classifier,
#   importer                  -> pulled fresh each time a job is run
name: Build and publish Docker images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data-collection/**"
      - "classification pipeline/**"
      - "database/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:   # allows a manual run from the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          - name: collector
            context: data-collection
          - name: classifier
            context: classification pipeline
          - name: importer
            context: database
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
