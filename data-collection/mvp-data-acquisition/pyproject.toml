[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cits5206-av-jobs-mvp"
version = "0.2.0"
description = "Scrapy MVP for versioned AV-company job snapshots, Parquet and DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Scrapy>=2.13,<3",
  "beautifulsoup4>=4.13,<5",
  "pydantic>=2.11,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19,<24",
  "duckdb>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["av_jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
