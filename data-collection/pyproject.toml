[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "av-job-pipeline"
version = "0.1.0"
description = "Collect and standardize autonomous-vehicle job postings."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "requests>=2.32",
]

[project.scripts]
av-jobs = "av_jobs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

